<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitTrack - Register</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #111827, #14532d);
            min-height: 100vh;
            color: #222;
        }

        /* NAVBAR */

        nav {
            background: #111827;
            color: white;

            padding: 18px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            color: #22c55e;
            font-size: 25px;
        }

        nav ul {
            list-style: none;

            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav ul li a:hover {
            color: #22c55e;
        }


        /* REGISTER AREA */

        .register-section {

            min-height: calc(100vh - 70px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }


        /* REGISTER CARD */

        .register-card {

            background: white;

            width: 100%;
            max-width: 500px;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);
        }


        .register-card h2 {

            text-align: center;

            color: #22c55e;

            font-size: 32px;

            margin-bottom: 8px;
        }


        .register-card .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }


        /* FORM */

        .form-group {

            margin-bottom: 17px;
        }


        .form-group label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

            color: #333;
        }


        .form-group input,
        .form-group select {

            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        .form-group input:focus,
        .form-group select:focus {

            border-color: #22c55e;

            box-shadow:
                0 0 0 2px rgba(34, 197, 94, 0.15);
        }


        /* TWO COLUMNS */

        .row {

            display: flex;

            gap: 15px;
        }


        .row .form-group {

            flex: 1;
        }


        /* TERMS */

        .terms {

            display: flex;

            align-items: flex-start;

            gap: 8px;

            margin: 15px 0;

            font-size: 13px;

            color: #555;
        }


        .terms input {

            margin-top: 2px;
        }


        /* BUTTON */

        .register-btn {

            width: 100%;

            padding: 13px;

            background: #22c55e;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .register-btn:hover {

            background: #16a34a;
        }


        /* MESSAGE */

        #message {

            text-align: center;

            margin-top: 15px;

            font-weight: bold;
        }


        /* LOGIN */

        .login-link {

            text-align: center;

            margin-top: 20px;

            color: #666;

            font-size: 14px;
        }


        .login-link a {

            color: #16a34a;

            font-weight: bold;

            text-decoration: none;
        }


        .login-link a:hover {

            text-decoration: underline;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            nav {

                flex-direction: column;

                gap: 12px;
            }

            nav ul {

                gap: 15px;
            }

            .register-card {

                padding: 25px;
            }

            .row {

                flex-direction: column;

                gap: 0;
            }
        }

    </style>

</head>


<body>


    <!-- NAVIGATION -->

    <nav>

        <h1>FitTrack 🏃</h1>

        <ul>

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="index.html#dashboard">Dashboard</a>
            </li>

            <li>
                <a href="index.html#tracker">Tracker</a>
            </li>

            <li>
                <a href="index.html#goals">Goals</a>
            </li>

        </ul>

    </nav>



    <!-- REGISTER SECTION -->

    <section class="register-section">

        <div class="register-card">


            <h2>Create Account 🏃</h2>

            <p class="subtitle">
                Join FitTrack and start your fitness journey
            </p>



            <!-- FORM -->

            <form id="registerForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter 10-digit phone number"
                        maxlength="10"
                        required
                    >

                </div>



                <!-- AGE + GENDER -->

                <div class="row">


                    <div class="form-group">

                        <label for="age">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            placeholder="Enter age"
                            min="10"
                            max="100"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="gender">
                            Gender
                        </label>

                        <select id="gender" required>

                            <option value="">
                                Select
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>



                <!-- TERMS -->

                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">

                        I agree to the
                        <a href="#">
                            Terms & Conditions
                        </a>

                    </label>

                </div>



                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>



                <!-- MESSAGE -->

                <p id="message"></p>


            </form>



            <!-- BACK TO WEBSITE -->

            <div class="login-link">

                Already have an account?

                <a href="index.html">
                    Go to Dashboard
                </a>

            </div>


        </div>

    </section>



    <!-- JAVASCRIPT -->

    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                let name =
                    document.getElementById("name").value.trim();


                let email =
                    document.getElementById("email").value.trim();


                let phone =
                    document.getElementById("phone").value.trim();


                let password =
                    document.getElementById("password").value;


                let confirmPassword =
                    document.getElementById("confirmPassword").value;


                let message =
                    document.getElementById("message");



                /* PASSWORD CHECK */

                if (password.length < 6) {

                    message.style.color = "red";

                    message.innerText =
                        "Password must contain at least 6 characters.";

                    return;
                }



                /* CONFIRM PASSWORD */

                if (password !== confirmPassword) {

                    message.style.color = "red";

                    message.innerText =
                        "Passwords do not match.";

                    return;
                }



                /* PHONE CHECK */

                if (!/^[0-9]{10}$/.test(phone)) {

                    message.style.color = "red";

                    message.innerText =
                        "Please enter a valid 10-digit phone number.";

                    return;
                }



                /* SAVE USER INFORMATION */

                localStorage.setItem(
                    "fitnessUserName",
                    name
                );

                localStorage.setItem(
                    "fitnessUserEmail",
                    email
                );



                /* SUCCESS MESSAGE */

                message.style.color = "#16a34a";

                message.innerText =
                    "Registration successful! 🎉";



                /* GO BACK TO MAIN WEBSITE */

                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 1500);

            });

    </script>


</body>

</html>
